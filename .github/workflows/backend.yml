name: Backend contract and evaluation
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pytest -q --junitxml=reports/backend-tests.xml
      - run: python -m scripts.evaluate --output reports/ci-evaluation.json
      - name: Reproduce insufficient-evidence decision boundaries
        run: python -m scripts.decision_case --output reports/decision-case-ci.json
        env:
          DESIGNLENS_PROVIDER: extractive
      - uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: reports/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            outputs/browser-report.json
            docs/screenshots/
            frontend/test-results/
